[package]
name = "fotoeditor-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls"] }
tauri-plugin-window-state = "=2.5.0"
tempfile = "=3.27.0"
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
