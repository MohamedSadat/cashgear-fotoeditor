[package]
name = "fotoeditor-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fotoeditor-core = { path = "../fotoeditor-core" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
png = "=0.18.1"
crc32fast = "=1.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
qcms = { version = "=0.3.0", default-features = false, features = ["iccv4-enabled"] }

[dev-dependencies]
fotoeditor-select = { path = "../fotoeditor-select" }
