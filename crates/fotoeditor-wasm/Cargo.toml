[package]
name = "fotoeditor-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
fotoeditor-gpu = { path = "../fotoeditor-gpu" }
fotoeditor-core = { path = "../fotoeditor-core" }
fotoeditor-io = { path = "../fotoeditor-io" }
serde_json = "1.0"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["OffscreenCanvas"] }
fotoeditor-brush = { version = "0.1.0", path = "../fotoeditor-brush" }
fotoeditor-select = { version = "0.1.0", path = "../fotoeditor-select" }
