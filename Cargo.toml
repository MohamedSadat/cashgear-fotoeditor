[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/fotoeditor-core", "crates/fotoeditor-brush", "crates/fotoeditor-select", "crates/fotoeditor-filters", "crates/fotoeditor-io", "crates/fotoeditor-gpu", "crates/fotoeditor-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.99.1"

[workspace.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
js-sys = "0.3.106"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Pixel/codecs need throughput; shrink the browser/GPU glue separately.
[profile.release.package.fotoeditor-core]
opt-level = 3
[profile.release.package.fotoeditor-io]
opt-level = 3
[profile.release.package.fotoeditor-brush]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.png]
opt-level = 3
