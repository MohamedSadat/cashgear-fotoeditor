name: Clean Windows 10 installer verification
on:
  workflow_dispatch:
    inputs:
      installer-run:
        description: FotoEditor CI run with installer upgrade artifacts
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  windows-10:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check installer source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSTALLER_RUN: ${{ inputs.installer-run }}
        run: |
          test "$(gh run view "$INSTALLER_RUN" --json headSha --jq .headSha)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.installer-run }}
          github-token: ${{ github.token }}
          name: windows-installer-upgrade-verification
          path: bench/results/desktop-acceptance/
      - run: pnpm install --frozen-lockfile
      - name: Prepare a Windows test VM
        run: |
          test -c /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          # The disposable VM job uses Windows media in place of the Android SDK.
          sudo rm -rf /usr/local/lib/android
          df -h / /mnt
      - run: node scripts/windows-client-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-windows-10-verification
          path: bench/results/clean-windows-10/
