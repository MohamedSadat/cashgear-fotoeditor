name: FotoEditor checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-latest
    # P9's 560-case software matrix measured 72 minutes; the full job took 84.
    # Leave aggregate headroom for builds and both WebView2 backends.
    timeout-minutes: 120
    env:
      GPU_TEST_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Ensure WebView2 Runtime
        run: ./scripts/setup-webview2.ps1
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:wasm
      - run: cargo fmt --all --check
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p fotoeditor-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm licenses:check
      - run: pnpm exec playwright install chromium
      - name: Run pnpm test:e2e
        # Acceptance requires one clean full matrix. Stop a failed run promptly;
        # the retained artifact records the failure, never a retried pass.
        run: pnpm test:e2e --max-failures=1 --retries=0
      - run: pnpm desktop:build
      - run: pnpm desktop:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: |
            bench/results/
            playwright-report/
            test-results/
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GPU_TEST_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:wasm
      - run: pnpm desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - run: cargo run --release -p fotoeditor-io --example layers -- bench/results/fixtures/layers-small.cgfoto 128 128 3
      - run: pnpm exec node scripts/desktop-package-smoke.mjs prepare
      - run: pnpm exec node scripts/desktop-package-smoke.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-upgrade-verification
          path: bench/results/desktop-acceptance/
  windows-11-package:
    needs: windows-package
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      GPU_TEST_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-upgrade-verification
          path: bench/results/desktop-acceptance/
      - run: pnpm exec node scripts/desktop-package-smoke.mjs verify
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-11-arm-emulated-x64-verification
          path: bench/results/desktop-acceptance/verification.json
